backend: mock        # mock | hf | vllm — vllm needs the vllm package + a
                    # CUDA GPU; without it the service warns at startup
                    # and falls back to the hf backend
model_id: Qwen/Qwen2-0.5B-Instruct   # verified small default for the hf backend
dtype: float16
quantization: none    # none | 8bit — int8 weights via bitsandbytes (halves
                      # weight memory, works on CPU); falls back to none
                      # with a logged warning if the 8-bit load fails
vllm_quantization: none   # none | awq | gptq — passed to vllm's LLM();
                          # only for pre-quantized checkpoints
prompt_dir: prompts/v1
lazy_load: true     # true = model loads on the first request (cheap boot,
                    # slow first request); false = warm it up at startup
                    # (slower boot, fast first request) — flip to false on
                    # prod/Render, where a 20s first hit looks like a bug.
                    # while the model warms, GET /ready answers 503
                    # (loading) and flips to 200 once it's loaded
rate_limit:         # token bucket per api key — cheap guardrail so one
                    # client can't hammer the model backend. keyed on the
                    # X-API-Key header; without one everyone shares a
                    # default bucket (real per-key auth lands in a later
                    # item). / and /info and the /health + /ready probes
                    # are never throttled
  enabled: true
  rate_per_sec: 10.0  # sustained requests/second per key
  burst: 30           # how many requests can land at once
auth:             # api key auth — who gets to call the model. keys from the
                  # env (LLM_API_KEYS, comma-separated) or the list below.
                  # empty = open access (local dev, the keyless demo); set at
                  # least one and everything but / and /info and the probes
                  # (/health, /ready) needs a valid key
                  # (X-API-Key header or Authorization: Bearer) or gets a 401
  keys: []        # e.g. ["team-alpha-…"]
logging:          # per-request jsonl log — latency, tokens, cost estimate
  enabled: true   # LLM_REQUEST_LOG=off disables; a path there overrides file
  file: logs/requests.jsonl   # one json object per line: ts, method, path,
                  # status, latency_ms, prompt/completion/total_tokens,
                  # cost_usd, backend, key_hash (sha, never the key), stream
  cost_prompt_per_1m: 0.50      # $ per 1M tokens for the api backend
  cost_completion_per_1m: 1.50  # local backends (mock/hf/vllm) always cost 0
cache:            # prompt cache — exact match first, optional semantic tier.
                  # repeated prompts return the stored response without
                  # touching the backend; stats land in /info.cache
  enabled: true   # set false to bypass (nothing cached, nothing served)
  ttl_seconds: 3600   # cached responses expire after this long
  max_entries: 500    # lru-ish: the oldest-read entry drops past this
  semantic:       # near-duplicate prompts — stdlib hashing embedding only
                  # (SWAP: drop in a real embedder for production use)
    enabled: false    # off by default — opt in when you want it
    threshold: 0.97   # cosine similarity needed to count as the same prompt
retry:            # retry transient backend failures before giving up
  enabled: true   # LLM_RETRY_ENABLED=0 disables
  max_attempts: 3 # total tries per backend call (1 = no retry)
                  # LLM_RETRY_MAX_ATTEMPTS overrides
  base_delay_seconds: 0.5   # first retry waits this long, then doubles
                  # LLM_RETRY_BASE_DELAY overrides
  jitter_seconds: 0.25      # random 0..jitter added per retry, so a fleet
                  # doesn't hammer the backend in lockstep
                  # LLM_RETRY_JITTER overrides
circuit_breaker:  # stop calling a backend that's clearly down — fail fast
                  # with a 503 instead of burning retries on every request
  enabled: true   # LLM_CB_ENABLED=0 disables
  failure_threshold: 5    # consecutive failures before the breaker opens
                  # LLM_CB_FAILURE_THRESHOLD overrides
  cooldown_seconds: 30.0  # an open breaker fails fast for this long, then
                  # one probe call goes through (half-open): success
                  # closes it, failure opens it again
                  # LLM_CB_COOLDOWN overrides
shutdown:         # graceful shutdown — SIGTERM/SIGINT drains instead of
                  # dropping: new requests get a 503, in-flight ones
                  # (streaming responses especially) finish first
  grace_seconds: 20   # how long to wait for in-flight requests before the
                      # process exits anyway — LLM_GRACEFUL_SECS overrides
history:          # multi-turn truncation — long conversations get cut down
                  # to the context budget before they reach the model, so a
                  # 50-turn chat never blows the window. strategies:
                  # sliding_window drops the oldest turns (cheap, no model
                  # needed); summarise keeps the last keep_recent turns and
                  # collapses the older ones into one summary via the
                  # backend (mock-safe: the mock's templated answer stands
                  # in, and a failed call falls back to a plain excerpt)
  strategy: sliding_window   # sliding_window | summarise —
                            # LLM_HISTORY_STRATEGY overrides; /chat and
                            # /v1/chat/completions accept a per-request
                            # "history_strategy" body field
  max_tokens: 4096          # budget for history tokens, char-estimated
                            # (~4 chars/token) — LLM_HISTORY_MAX_TOKENS
  keep_recent: 10           # summarise keeps this many recent turns verbatim
                            # — LLM_HISTORY_KEEP_RECENT
