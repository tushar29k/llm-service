<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>llm-service — demo</title>
<style>
:root{--bg:#0B1424;--bg2:#0E1A2E;--line:#182742;--cyan:#22D3EE;--teal:#2DD4BF;--violet:#A78BFA;--text:#E6EDF3;--muted:#8B98A9}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.6;padding:2rem 1.2rem;max-width:860px;margin:0 auto}
header{display:flex;align-items:center;gap:.8rem;margin-bottom:.4rem;flex-wrap:wrap}
h1{font-size:1.4rem}h1 span{color:var(--cyan)}
.badge{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.25rem .8rem}
.badge b{color:var(--teal)}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:1.4rem}
.tabs{display:flex;gap:.6rem;margin-bottom:1.4rem}
.tabs button{background:var(--bg2);border:1px solid var(--line);color:var(--muted);padding:.55rem 1.2rem;border-radius:999px;cursor:pointer;font-size:.9rem}
.tabs button.active{color:var(--cyan);border-color:var(--cyan)}
#log{display:flex;flex-direction:column;gap:.7rem;margin-bottom:1.2rem;min-height:160px}
.msg{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:.9rem 1.1rem;animation:fade .3s ease;white-space:pre-wrap}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.msg.user{align-self:flex-end;border-color:var(--cyan);max-width:85%}
.msg .cursor{display:inline-block;width:8px;height:1em;background:var(--cyan);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.row{display:flex;gap:.7rem}
input[type=text]{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:999px;color:var(--text);padding:.75rem 1.2rem;font-size:.95rem;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--cyan)}
button.go{background:linear-gradient(90deg,var(--cyan),var(--teal));border:none;color:#06222b;font-weight:700;padding:.75rem 1.6rem;border-radius:999px;cursor:pointer}
button.go:disabled{opacity:.5;cursor:wait}
textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:.8rem;font-size:.95rem;font-family:inherit;min-height:100px;resize:vertical;margin-bottom:.8rem}
pre.out{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:1rem;overflow-x:auto;font-size:.85rem;margin-top:1rem;color:var(--teal)}
.hidden{display:none}
label{color:var(--muted);font-size:.85rem;display:block;margin:.6rem 0}
</style>
</head>
<body>
<header><h1>llm-service <span>demo</span></h1><span class="badge" id="info">backend: …</span></header>
<p class="sub">Chat with streaming, or pull structured JSON out of messy text.</p>

<div class="tabs">
  <button id="tab-chat" class="active" onclick="show('chat')">Chat</button>
  <button id="tab-extract" onclick="show('extract')">Extract JSON</button>
</div>

<div id="pane-chat">
  <div id="log"></div>
  <div class="row">
    <input type="text" id="msg" placeholder="Say something…" onkeydown="if(event.key==='Enter')send()" />
    <button class="go" id="sendbtn" onclick="send()">Send →</button>
  </div>
</div>

<div id="pane-extract" class="hidden">
  <textarea id="prompt" placeholder="Paste messy text, e.g. an email with an invoice…"></textarea>
  <label>required fields (comma separated)</label>
  <input type="text" id="fields" placeholder="name, amount, date" style="margin-bottom:.8rem" />
  <div><button class="go" id="xbtn" onclick="extract()">Extract →</button></div>
  <pre class="out hidden" id="xout"></pre>
</div>

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function show(w){['chat','extract'].forEach(function(x){document.getElementById('pane-'+x).classList.toggle('hidden',x!==w);document.getElementById('tab-'+x).classList.toggle('active',x===w)})}
fetch('/info').then(function(r){return r.json()}).then(function(i){
  document.getElementById('info').innerHTML='backend: <b>'+esc(i.backend)+'</b>'+(i.model?' · '+esc(i.model):'');
}).catch(function(){document.getElementById('info').textContent='backend: unknown'});

var history=[];
function send(){
  var input=document.getElementById('msg');var text=input.value.trim();if(!text)return;input.value='';
  var log=document.getElementById('log');
  var u=document.createElement('div');u.className='msg user';u.textContent=text;log.appendChild(u);
  var b=document.createElement('div');b.className='msg';b.innerHTML='<span class="cursor"></span>';log.appendChild(b);
  b.scrollIntoView({behavior:'smooth',block:'nearest'});
  var btn=document.getElementById('sendbtn');btn.disabled=true;
  history.push({role:'user',content:text});
  fetch('/chat/stream',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:history})})
  .then(function(res){
    var reader=res.body.getReader();var dec=new TextDecoder();var buf='';var full='';
    function pump(){
      return reader.read().then(function(x){
        if(x.done){finish();return}
        buf+=dec.decode(x.value,{stream:true});
        var parts=buf.split('\n\n');buf=parts.pop();
        parts.forEach(function(p){
          var m=/^data: ([\s\S]*)$/m.exec(p);
          if(m){full+=m[1];b.innerHTML=esc(full)+'<span class="cursor"></span>'}
        });
        return pump();
      });
    }
    function finish(){
      b.innerHTML=esc(full);btn.disabled=false;
      history.push({role:'assistant',content:full});
    }
    return pump();
  }).catch(function(e){b.textContent='Error: '+e.message;btn.disabled=false});
}

function extract(){
  var btn=document.getElementById('xbtn');btn.disabled=true;btn.textContent='Extracting…';
  var out=document.getElementById('xout');out.classList.remove('hidden');out.textContent='…';
  var required=document.getElementById('fields').value.split(',').map(function(s){return s.trim()}).filter(Boolean);
  fetch('/extract',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({prompt:document.getElementById('prompt').value,required:required})})
  .then(function(r){return r.json()}).then(function(d){out.textContent=JSON.stringify(d,null,2)})
  .catch(function(e){out.textContent='Error: '+e.message})
  .finally(function(){btn.disabled=false;btn.textContent='Extract →'});
}
</script>
</body>
</html>
