<!DOCTYPE html>
<html lang="en" data-theme="nebula">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>llm-service — nebula demo</title>
<style>
/* nebula: deep-space cosmic skin over the same demo flows */
:root{
  --deep:#0b0620; --deep2:#120b2e;
  --violet:#8b5cf6; --vio:#a78bfa; --cyan:#67e8f9; --pink:#f0abfc;
  --text:#efeaff; --muted:#a79fc9; --line:rgba(167,139,250,.22);
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--deep)}
body{
  color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;line-height:1.6;
  padding:2.5rem 1.2rem 3rem;max-width:880px;margin:0 auto;min-height:100vh;position:relative;
}
/* aurora wash behind everything */
body::before{
  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(60% 40% at 15% 0%, rgba(139,92,246,.28), transparent 70%),
    radial-gradient(50% 35% at 85% 20%, rgba(103,232,249,.14), transparent 70%),
    radial-gradient(55% 45% at 50% 100%, rgba(240,171,252,.10), transparent 70%),
    linear-gradient(180deg,#0b0620,#140c33 60%,#0b0620);
}
/* tiny starfield: two tiled dot layers, cheap and static */
.stars{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.7;
  background-image:
    radial-gradient(1px 1px at 20px 30px, #fff, transparent),
    radial-gradient(1px 1px at 130px 90px, rgba(255,255,255,.6), transparent),
    radial-gradient(1.5px 1.5px at 70px 160px, rgba(199,210,254,.8), transparent);
  background-size:220px 220px, 340px 340px, 420px 420px;
}
header{display:flex;align-items:center;gap:.9rem;margin-bottom:.5rem;flex-wrap:wrap}
/* little glowing planet for the brand */
.orb{width:34px;height:34px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 32% 30%, #fdf4ff, var(--vio) 45%, #4c1d95 100%);
  box-shadow:0 0 22px rgba(167,139,250,.65), 0 0 60px rgba(139,92,246,.25);}
h1{font-size:1.45rem;font-weight:800;letter-spacing:.5px}
h1 .neb{color:var(--vio)}
.badge{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;
  padding:.3rem .9rem;background:rgba(139,92,246,.08);backdrop-filter:blur(4px)}
.badge b{color:var(--cyan);font-weight:600}
.sub{color:var(--muted);font-size:.92rem;margin-bottom:1.6rem}
/* thin aurora divider */
.rule{height:1px;margin:0 0 1.4rem;border:0;
  background:linear-gradient(90deg,transparent,var(--vio),var(--cyan),transparent);opacity:.5}
.tabs{display:flex;gap:.6rem;margin-bottom:1.5rem}
.tabs button{background:rgba(139,92,246,.08);border:1px solid var(--line);color:var(--muted);
  padding:.6rem 1.4rem;border-radius:999px;cursor:pointer;font-size:.9rem;font-family:inherit;
  transition:border-color .2s,color .2s,box-shadow .2s}
.tabs button.active{color:#fff;border-color:var(--vio);
  box-shadow:0 0 18px rgba(139,92,246,.45), inset 0 0 12px rgba(139,92,246,.15)}
#log{display:flex;flex-direction:column;gap:.8rem;margin-bottom:1.3rem;min-height:160px}
.msg{background:rgba(18,11,46,.72);border:1px solid var(--line);border-radius:18px;
  padding:.95rem 1.15rem;animation:rise .3s ease;white-space:pre-wrap;backdrop-filter:blur(6px)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.msg.user{align-self:flex-end;max-width:85%;
  background:linear-gradient(135deg,rgba(139,92,246,.30),rgba(103,232,249,.12));
  border-color:rgba(167,139,250,.55);box-shadow:0 0 24px rgba(139,92,246,.18)}
.msg .cursor{display:inline-block;width:8px;height:1em;background:var(--cyan);
  vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.row{display:flex;gap:.7rem}
input[type=text]{flex:1;min-width:0;background:rgba(18,11,46,.72);border:1px solid var(--line);
  border-radius:999px;color:var(--text);padding:.8rem 1.3rem;font-size:.95rem;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--vio);box-shadow:0 0 16px rgba(139,92,246,.35)}
button.go{background:linear-gradient(100deg,var(--violet),#22d3ee);border:none;color:#0b0620;
  font-weight:700;padding:.8rem 1.7rem;border-radius:999px;cursor:pointer;font-family:inherit;
  box-shadow:0 0 20px rgba(139,92,246,.45);transition:transform .15s,box-shadow .2s}
button.go:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 0 28px rgba(139,92,246,.6)}
button.go:disabled{opacity:.5;cursor:wait}
.status{min-height:1.3em;font-size:.82rem;color:var(--muted);margin-top:.55rem;letter-spacing:.02em}
textarea{width:100%;background:rgba(18,11,46,.72);border:1px solid var(--line);border-radius:16px;
  color:var(--text);padding:.9rem 1rem;font-size:.95rem;font-family:inherit;min-height:110px;
  resize:vertical;margin-bottom:.8rem}
pre.out{background:rgba(8,4,24,.85);border:1px solid var(--line);border-radius:16px;
  padding:1.1rem;overflow-x:auto;font-size:.85rem;margin-top:1rem;color:var(--cyan);
  box-shadow:inset 0 0 30px rgba(139,92,246,.08)}
.hidden{display:none}
label{color:var(--muted);font-size:.85rem;display:block;margin:.6rem 0}
@media(max-width:560px){
  body{padding:1.6rem .9rem 2.5rem}
  .row{flex-direction:column}
  button.go{width:100%}
  .msg.user{max-width:100%}
}
</style>
</head>
<body>
<div class="stars"></div>
<header><span class="orb"></span><h1>llm-service <span class="neb">nebula</span></h1><span class="badge" id="info">backend: …</span></header>
<p class="sub">Chat with streaming, or pull structured JSON out of messy text — now from deep space.</p>
<hr class="rule" />

<div class="tabs">
  <button id="tab-chat" class="active" onclick="show('chat')">Chat</button>
  <button id="tab-extract" onclick="show('extract')">Extract JSON</button>
</div>

<div id="pane-chat">
  <div id="log"></div>
  <div class="row">
    <input type="text" id="msg" placeholder="Ask across the void…" onkeydown="if(event.key==='Enter')send()" />
    <button class="go" id="sendbtn" onclick="send()">Send →</button>
  </div>
  <div class="status" id="status"></div>
</div>

<div id="pane-extract" class="hidden">
  <textarea id="prompt" placeholder="Paste messy text, e.g. an email with an invoice…"></textarea>
  <label>required fields (comma separated)</label>
  <input type="text" id="fields" placeholder="name, amount, date" style="margin-bottom:.8rem" />
  <div><button class="go" id="xbtn" onclick="extract()">Extract →</button></div>
  <pre class="out hidden" id="xout"></pre>
</div>

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function show(w){['chat','extract'].forEach(function(x){document.getElementById('pane-'+x).classList.toggle('hidden',x!==w);document.getElementById('tab-'+x).classList.toggle('active',x===w)})}
fetch('/info').then(function(r){return r.json()}).then(function(i){
  document.getElementById('info').innerHTML='backend: <b>'+esc(i.backend)+'</b>'+(i.model?' · '+esc(i.model):'');
}).catch(function(){document.getElementById('info').textContent='backend: unknown'});

var history=[];
var statusEl=document.getElementById('status');
function setStatus(t){if(statusEl)statusEl.textContent=t||''}
function send(){
  var input=document.getElementById('msg');var text=input.value.trim();if(!text)return;input.value='';
  var log=document.getElementById('log');
  var u=document.createElement('div');u.className='msg user';u.textContent=text;log.appendChild(u);
  var b=document.createElement('div');b.className='msg';b.innerHTML='<span class="cursor"></span>';log.appendChild(b);
  b.scrollIntoView({behavior:'smooth',block:'nearest'});
  var btn=document.getElementById('sendbtn');btn.disabled=true;
  history.push({role:'user',content:text});
  setStatus('waking up the demo server… (free tier, first reply can take ~30s)');
  var ctrl=new AbortController();var gotData=false;
  // nothing at all within 40s means the sleeping server is still waking —
  // stop waiting and say so instead of leaving a dead-looking button
  var firstByte=setTimeout(function(){ctrl.abort()},40000);
  // absolute backstop: a stalled stream can never lock the ui
  var hardStop=setTimeout(function(){ctrl.abort()},90000);
  function done(){clearTimeout(firstByte);clearTimeout(hardStop);setStatus('');btn.disabled=false}
  fetch('/chat/stream',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:history}),signal:ctrl.signal})
  .then(function(res){
    if(!res.ok){throw new Error('server returned '+res.status)}
    var reader=res.body.getReader();var dec=new TextDecoder();var buf='';var full='';
    function pump(){
      return reader.read().then(function(x){
        if(x.done){finish();return}
        if(!gotData){gotData=true;clearTimeout(firstByte);setStatus('streaming…')}
        buf+=dec.decode(x.value,{stream:true});
        var parts=buf.split('\n\n');buf=parts.pop();
        parts.forEach(function(p){
          var m=/^data: ([\s\S]*)$/m.exec(p);
          if(m){full+=m[1];b.innerHTML=esc(full)+'<span class="cursor"></span>'}
        });
        return pump();
      });
    }
    function finish(){
      done();
      b.innerHTML=esc(full);
      history.push({role:'assistant',content:full});
    }
    return pump();
  }).catch(function(e){
    done();
    var aborted=e&&e.name==='AbortError';
    b.textContent=aborted?(gotData?'timed out waiting for the server — tap send again'
                                 :'server is still waking up — tap send again')
                          :('Error: '+e.message+' — please try again');
  });
}

function extract(){
  var btn=document.getElementById('xbtn');btn.disabled=true;btn.textContent='Extracting…';
  var out=document.getElementById('xout');out.classList.remove('hidden');out.textContent='…';
  var required=document.getElementById('fields').value.split(',').map(function(s){return s.trim()}).filter(Boolean);
  fetch('/extract',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({prompt:document.getElementById('prompt').value,required:required})})
  .then(function(r){return r.json()}).then(function(d){out.textContent=JSON.stringify(d,null,2)})
  .catch(function(e){out.textContent='Error: '+e.message})
  .finally(function(){btn.disabled=false;btn.textContent='Extract →'});
}
</script>
</body>
</html>
