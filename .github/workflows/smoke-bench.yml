# CI: smoke + bench regression on every push/PR to main. The smoke test
# exercises the whole pipeline on the mock backend (no keys, no GPU, no
# downloads); the bench gate fails the build if mock-backend throughput
# drops more than 30% below the committed bench/baseline.json or the
# structured-extract path breaks.
name: smoke-bench

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile sources
        run: python -m py_compile $(git ls-files '*.py')

      - name: Smoke test
        run: python test_smoke.py

      - name: Bench regression gate
        run: python bench_check.py
